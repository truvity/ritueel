# The release: a tag `vX.Y.Z` (or `vX.Y.Z-suffix`) that the maintainer pushes makes GoReleaser build
# `ritueel` for Linux on amd64 and arm64 (.goreleaser.yaml), one .tar.gz for each, and SHA256SUMS, and
# puts them on the repository's GitHub Releases page. THE FILES ARE NOT SIGNED: the archives and
# SHA256SUMS are plain, and a consumer's trust is the digest it pinned. No release is signed until the
# project's root is adopted and drilled (record 0009, rules 12 to 14).
#
# Four jobs, and the one that writes runs no code of this repository:
#   verify   read-only: go-check on the tagged commit, which includes the snapshot build.
#   build    read-only, and no step that runs repository code is given a write token: builds the
#            release for the tag (GoReleaser, without publishing), checks that build, and keeps the
#            release files (the two archives and SHA256SUMS) and the release text (NOTES.md) as a
#            workflow artifact. It gives one digest over all four as a job output.
#   test     no permissions, no checkout, no tool: takes that artifact, checks it against the digest,
#            and on a runner of each machine (amd64 and arm64) unpacks the archive of that machine and
#            runs the binary in it, which must print exactly the stamped version and commit. No step
#            that runs a built binary is given a token.
#   publish  the only job with `contents: write`: it checks out nothing, installs no tool and runs no
#            code of the repository. It needs `test` to have passed on both machines. It downloads the
#            artifact and, before any other check, compares it with the digest from `build` (a job of
#            this run that ran a built binary could have replaced the artifact; a job output it cannot
#            rewrite). It then checks the files against SHA256SUMS, refuses a tag for which any release,
#            draft or published, exists, and creates the release as a draft with the two archives and
#            SHA256SUMS, and NOTES.md as its text. It asks GitHub with `git ls-remote` which commit the
#            tag points at, before the draft and once more after it, and publishes the draft only if it
#            is the commit that `verify` and `build` checked out (each gives its commit as a job
#            output). If the tag moved after the draft was made, the draft stays and a person deletes it
#            by hand; the job deletes nothing. What is published is the build that was checked; nothing
#            is built twice.
#
# Only a push of a tag runs `publish`. A pull request cannot reach any job: there is no `pull_request`,
# `pull_request_target` or `workflow_run` trigger. `workflow_dispatch` is a dry run: it runs `verify`,
# a snapshot `build` (the version `v0.0.0-snapshot`, a name that a real tag may not have) and `test`
# on both machines, and never publishes. It starts from the Actions tab or
# `gh workflow run release.yaml --ref <branch>`, and only once this file is on the default branch.
# No tag is made by this workflow and none is moved or deleted.
#
# WHAT THE CHECKS ARE. The tag form (no leading zeros), and "the commit is on main", guard against a
# mistake, such as a tag on the wrong commit or a mistyped name. They are not a boundary against a
# person who may push to this repository: a tag runs the workflow file of its own commit, so such a
# person can push a tag whose file has no check. The boundary is who may push tags (a tag ruleset, which
# is a repository setting) and who has write access to the repository.
#
# ABOUT TOKENS. Only `publish` has a write token. The token of every other job is read-only (`verify`
# and `build`: `contents: read`) or has no permission at all (`test`). No step that runs code of this
# repository, or a binary built from it, is given a write token, and none is given a token through
# `env`. Two actions of the jobs that run repository code use the job's read-only token on their own:
#   - `checkout` has a `token` input that defaults to the job's token. It uses it to fetch, and
#     `persist-credentials: false` removes it from the git configuration afterwards.
#   - the devbox install action has no token input. Two of its own steps read `github.token`: one writes
#     it into the Nix configuration (`disable-nix-access-token` skips that step), the other runs only
#     when the action has failed, and uses it for `gh cache list`.
# `download-artifact` has no default token and receives none here (a token is for another run).
#
# The tools come from this repository's own devbox.json and devbox.lock (GoReleaser included), through
# the same public action as the `go` job of checks.yaml, with `disable-nix-access-token`.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: read

# One group for each tag. A run that has started is never cancelled (`cancel-in-progress: false`); a run
# that is still waiting for the group can be dropped when a newer one queues in it, which for a tag is
# a push of the same tag again. The event is in the group, as in security.yaml.
concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Read-only. What the tagged commit must pass before anything is built for release, and the dry run
  # on any branch. For a tag it also refuses a tag that is not `vX.Y.Z` or `vX.Y.Z-suffix` and a commit
  # that is not on main (a guard against mistakes, see above).
  verify:
    name: verify (tag, go-check, snapshot build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      # The commit this job really checked out, for `publish` to compare with the tag's commit.
      commit: ${{ steps.head.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit the event named (for a tag push, the tag's commit when it was pushed), the same
          # as `build` checks out, so that a tag moved since is seen by `publish` and not followed here.
          ref: ${{ github.sha }}
          # The tag, the history (the release notes) and origin/main (the commit must be on it).
          fetch-depth: 0
          persist-credentials: false
      - name: Say which commit is checked out
        id: head
        run: echo "commit=$(git rev-parse 'HEAD^{commit}')" >> "$GITHUB_OUTPUT"
      - name: The tag is vX.Y.Z or vX.Y.Z-suffix, and its commit is on main
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::the tag '$TAG' is not vX.Y.Z or vX.Y.Z-suffix"
            exit 1
          fi
          # The name of the dry run (the snapshot of `go-release-check`, which `build` and `test` use
          # below) is not a release. Keep this name identical to the one in the Justfile and in `test`.
          if [ "$TAG" = "v0.0.0-snapshot" ]; then
            echo "::error::the tag '$TAG' is the name of the dry run and cannot be a release"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$COMMIT" refs/remotes/origin/main; then
            echo "::error::the commit of the tag $TAG is not on main"
            exit 1
          fi
      - uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        with:
          devbox-version: "0.19.0"
          # sha256 of the extracted devbox binary (linux-amd64), not of the release archive.
          sha256-checksum: "828fb26b9bc2ac63eb3fbc09aea365123db1d2810d0870895f67b5bbffd5ecdb"
          disable-nix-access-token: "true"
          enable-cache: "false"
          refresh-cli: "true"
      # The same recipe as the `go` job of checks.yaml; it includes go-release-check, the snapshot build.
      - run: devbox run -- just go-check

  # Read-only: the job's own token is `contents: read`, and no step that runs repository code is given
  # a write token or any token through `env`. `checkout` (a token input) and the devbox install action
  # (two steps of its own) use the read-only token inside the actions; see "ABOUT TOKENS" above. It
  # builds the release for the tag without publishing, runs the whole check on that build
  # (`go-release-build` refuses a tag that is badly formed, the dry run's name, not at this commit or
  # not on main, then `_go-release-verify`), and keeps the two archives, SHA256SUMS and the release
  # notes (NOTES.md, the text of the release page). It runs on the commit that the tag event named, not
  # on whatever the tag points at by then.
  build:
    name: build (GoReleaser, no publishing, checked)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      # The commit this job really built, for `publish` to compare with the tag's commit.
      commit: ${{ steps.head.outputs.commit }}
      # One digest over every file that is kept (see the step `files`), for `test` and `publish` to
      # check the artifact against before they use a byte of it.
      files: ${{ steps.files.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Say which commit is checked out
        id: head
        run: echo "commit=$(git rev-parse 'HEAD^{commit}')" >> "$GITHUB_OUTPUT"
      - uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        with:
          devbox-version: "0.19.0"
          # sha256 of the extracted devbox binary (linux-amd64), not of the release archive.
          sha256-checksum: "828fb26b9bc2ac63eb3fbc09aea365123db1d2810d0870895f67b5bbffd5ecdb"
          disable-nix-access-token: "true"
          enable-cache: "false"
          refresh-cli: "true"
      # A push is always a tag (the trigger lists tags only). The dry run builds a snapshot, which needs
      # no tag, so that `test` below is proven before the first real tag; it stamps `v0.0.0-snapshot`
      # (the tag of go-release-check, which `test` expects), and leaves the archives and SHA256SUMS.
      - name: Build the release for the tag, and check it
        if: github.event_name == 'push'
        run: devbox run -- just go-release-build
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Dry run, build a snapshot, and check it
        if: github.event_name == 'workflow_dispatch'
        run: devbox run -- just go-release-check
      # One digest over all the files in dist/upload/: the archives, SHA256SUMS and, for a tag, NOTES.md
      # (the release text, which no sum covers), names and contents (the sha256 of the `sha256sum` lines
      # of the files in C order, dotfiles included). It is a job output, which a job of the same run
      # cannot rewrite through the artifact store, so `test` and `publish` can tell whether the artifact
      # they downloaded is the one this job made. The same two lines are in `test` and `publish`.
      - name: One digest over every file that is kept
        id: files
        run: |
          export LC_ALL=C
          shopt -s dotglob
          d=$(cd dist/upload && sha256sum -- * | sha256sum | cut -d' ' -f1)
          [[ "$d" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::the digest of the files is not 64 hex digits"; exit 1; }
          echo "digest=$d" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/upload/
          if-no-files-found: error
          retention-days: 7

  # Each built binary is run on a machine of its own architecture, from the artifact `release-files`
  # that `publish` will publish, not from a second build. The arm64 binary is never run on the build
  # runner (amd64), so this is where it is first run. `ubuntu-24.04-arm` is GitHub's hosted Linux arm64
  # runner, free and unlimited for a public repository (the page "GitHub-hosted runners").
  #
  # `permissions: {}`: nothing in this job reads or writes the repository. The artifact belongs to this
  # run, and download-artifact takes it with the runner's own credentials; its `github-token` input has
  # no default and is only for an artifact of another run, so no step here receives a token. No
  # checkout, no devbox, no Go; the step that runs the binary has nothing but the values below in its
  # environment.
  test:
    name: test (${{ matrix.arch }} binary on a ${{ matrix.arch }} runner)
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            machine: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            machine: aarch64
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release
      - name: Unpack the archive of this machine and run the binary in it
        env:
          ARCH: ${{ matrix.arch }}
          MACHINE: ${{ matrix.machine }}
          # What was stamped: the tag, and the commit that `build` checked out. The dry run stamps
          # `v0.0.0-snapshot` (the tag in `go-release-check`; the name is refused as a real tag by
          # `verify` and by `go-release-build`, so a release can never be mistaken for the dry run).
          TAG: ${{ github.event_name == 'push' && github.ref_name || 'v0.0.0-snapshot' }}
          COMMIT: ${{ needs.build.outputs.commit }}
          FILES: ${{ needs.build.outputs.files }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          # The message keeps only a safe set of characters (no line break, no `%`, no `$`), so that a
          # name or a line taken from a file cannot add a workflow command to the log.
          fail() { local m; m=$(printf '%s' "$*" | tr -c "A-Za-z0-9 ._+/=,;:()'-" '?'); echo "::error::${m}"; exit 1; }
          # Before anything else is read or unpacked: the folder is exactly what `build` made (its
          # digest is a job output). Without it a step of an earlier job could have replaced the artifact.
          [[ "$FILES" =~ ^[0-9a-f]{64}$ ]] || fail "the digest of the files from build is not 64 hex digits"
          shopt -s dotglob
          got=$(cd release && sha256sum -- * | sha256sum | cut -d' ' -f1)
          [ "$got" = "$FILES" ] || fail "the downloaded files are not the ones build made (digest $got, wanted $FILES)"
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || fail "the commit from build is not 40 hex digits: '$COMMIT'"
          [ "$(uname -m)" = "$MACHINE" ] || fail "this runner is $(uname -m), wanted $MACHINE for $ARCH"
          cd release
          sha256sum -c SHA256SUMS
          # SHA256SUMS names exactly two files: an amd64 archive and an arm64 archive, each
          # `ritueel_<characters of a version>_linux_<arch>.tar.gz`. This pattern does not make the two
          # versions equal; `publish` does that, it requires the exact names for the tag.
          names="$(awk '{print $2}' SHA256SUMS | LC_ALL=C sort | tr '\n' ' ')"
          re='^(ritueel_[A-Za-z0-9._+-]+_linux_amd64\.tar\.gz) (ritueel_[A-Za-z0-9._+-]+_linux_arm64\.tar\.gz) $'
          [[ "$names" =~ $re ]] || fail "SHA256SUMS does not name exactly the amd64 and the arm64 archive: $names"
          if [ "$ARCH" = amd64 ]; then archive="${BASH_REMATCH[1]}"; else archive="${BASH_REMATCH[2]}"; fi
          [ -f "$archive" ] && [ ! -L "$archive" ] || fail "$archive is not a regular file"
          # A size cap before anything is listed or unpacked: 200 MiB (209715200 bytes) for the file and
          # for what it unpacks to (the real archive is a few MiB), so that a bomb cannot fill the disk.
          limit=209715200
          [ "$(stat -c %s "$archive")" -le "$limit" ] || fail "$archive is larger than $limit bytes"
          [ "$(gzip -dc "$archive" | head -c "$((limit + 1))" | wc -c || true)" -le "$limit" ] || fail "$archive unpacks to more than $limit bytes"
          # Only these three plain files, no link, no device, no path (so none can reach outside the folder).
          [ "$(tar -tzf "$archive" | LC_ALL=C sort | tr '\n' ' ')" = "LICENSE README.md ritueel " ] || fail "$archive does not hold exactly LICENSE README.md ritueel"
          [ "$(tar -tvzf "$archive" | cut -c1 | sort -u | tr -d '\n')" = "-" ] || fail "$archive holds a member that is not a plain file"
          dir="$RUNNER_TEMP/unpacked"
          mkdir "$dir"
          tar -xzf "$archive" -C "$dir" --no-same-owner
          [ "$(find "$dir" -mindepth 1 | LC_ALL=C sort | tr '\n' ' ')" = "$dir/LICENSE $dir/README.md $dir/ritueel " ] || fail "the unpacked folder does not hold exactly the three files"
          [ -f "$dir/ritueel" ] && [ ! -L "$dir/ritueel" ] && [ -x "$dir/ritueel" ] || fail "ritueel is not a regular executable file"
          printf 'ritueel %s (commit %s)\n' "$TAG" "$COMMIT" > "$RUNNER_TEMP/want"
          "$dir/ritueel" version > "$RUNNER_TEMP/got"
          cat "$RUNNER_TEMP/got"
          cmp "$RUNNER_TEMP/got" "$RUNNER_TEMP/want" || fail "'ritueel version' did not print exactly what was stamped"
          rc=0; "$dir/ritueel" > /dev/null 2>&1 || rc=$?
          [ "$rc" -eq 2 ] || fail "no arguments should exit 2, got $rc"
          echo "$archive: ran on $(uname -m), printed the stamped version and commit"

  # The only job that writes (`contents: write`). It checks out nothing, installs no tool and runs no
  # code of this repository: its only steps are the download of the artifact, `gh` and `git ls-remote`,
  # which the runner has. Nothing is built here. The tag, the repository, the token, the two commits and
  # the digest reach the shell only through env.
  publish:
    name: publish (gh, GitHub Releases, unsigned)
    needs: [verify, build, test]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release
      - name: Check the files, refuse an existing release, create a draft, check the tag, publish
        env:
          TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          VERIFIED_COMMIT: ${{ needs.verify.outputs.commit }}
          BUILT_COMMIT: ${{ needs.build.outputs.commit }}
          FILES: ${{ needs.build.outputs.files }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          # `draft_note` is added to every failure once the draft exists (see below). The message keeps
          # only a safe set of characters (no line break, no `%`, no `$`), so that text taken from a file
          # or from the API cannot add a workflow command to the log.
          draft_note=""
          fail() { local m; m=$(printf '%s' "$*${draft_note}" | tr -c "A-Za-z0-9 ._+/=,;:()'-" '?'); echo "::error::${m}"; exit 1; }
          # Before any other check: the folder is exactly what `build` made, NOTES.md included (no sum
          # covers it). The digest is a job output of `build`; the artifact store could have been written
          # by a job that ran a built binary.
          [[ "$FILES" =~ ^[0-9a-f]{64}$ ]] || fail "the digest of the files from build is not 64 hex digits"
          shopt -s dotglob
          got=$(cd release && sha256sum -- * | sha256sum | cut -d' ' -f1)
          [ "$got" = "$FILES" ] || fail "the downloaded files are not the ones build made (digest $got, wanted $FILES)"
          cd release
          sha256sum -c SHA256SUMS
          a="ritueel_${TAG#v}_linux_amd64.tar.gz"
          b="ritueel_${TAG#v}_linux_arm64.tar.gz"
          [ "$(find . -mindepth 1 | LC_ALL=C sort | tr '\n' ' ')" = "./NOTES.md ./SHA256SUMS ./$a ./$b " ] || fail "the artifact does not hold exactly NOTES.md SHA256SUMS $a $b"
          [ "$(awk '{print $2}' SHA256SUMS | LC_ALL=C sort | tr '\n' ' ')" = "$a $b " ] || fail "SHA256SUMS does not name exactly the two archives"
          # No release of this name, draft or published. The list of the API is read (it shows every
          # release with a tag name, drafts too, in one answer; `gh release view` does not show a draft
          # to every caller). The documentation of "List releases" says "Only users with push access will
          # receive listings for draft releases"; that the token of this job (`contents: write`) is one
          # of them is not stated for a workflow token, and the first real run proves it: the list after
          # `create` below must find the draft, or the job stops there.
          names=$(gh api --paginate "repos/${GH_REPO}/releases" --jq '.[].tag_name') || fail "cannot list the releases of the repository"
          if grep -Fx -- "$TAG" <<<"$names" >/dev/null; then fail "a release (draft or published) for $TAG already exists"; fi
          # The tag must still point at the commit that `verify` and `build` checked out. This job has no
          # checkout, so it asks GitHub with `git ls-remote` over https, which needs no token for a public
          # repository (none is passed to git). The commit of an annotated tag is the peeled line
          # `refs/tags/TAG^{}`; a lightweight tag has only the plain line, and that is the commit. (The
          # REST call `commits/tags/TAG` was measured to answer 422 for an annotated tag, so it is not
          # used.) A pattern of ls-remote also matches the tail of a longer ref, so only lines whose ref
          # is exactly `refs/tags/TAG` or `refs/tags/TAG^{}` are kept. A tag that was moved after the
          # build would otherwise get a release page that points at the new commit and carries files
          # built from the old one. The command runs without a token, so GitHub treats it as anonymous,
          # and the address of a shared runner can be slowed down or refused for a moment: the command
          # gets three tries, five seconds apart, and only a failure of the command itself is tried
          # again (an answer with the wrong number of lines is never tried again). For a private
          # repository an anonymous request is refused for good, so this lookup fails closed: the job
          # stops at the first look, before any draft exists.
          tag_commit() {
            local out sha ref try plain="" peeled="" nplain=0 npeeled=0
            for try in 1 2 3; do
              if out=$(GIT_TERMINAL_PROMPT=0 git ls-remote "https://github.com/${GH_REPO}.git" "refs/tags/${TAG}" "refs/tags/${TAG}^{}"); then break; fi
              [ "$try" -lt 3 ] || fail "cannot ask GitHub which commit the tag $TAG points at (3 tries)"
              sleep 5
            done
            while read -r sha ref; do
              if [ "$ref" = "refs/tags/${TAG}" ]; then plain=$sha; nplain=$((nplain + 1))
              elif [ "$ref" = "refs/tags/${TAG}^{}" ]; then peeled=$sha; npeeled=$((npeeled + 1)); fi
            done <<<"$out"
            [ "$nplain" -eq 1 ] || fail "GitHub answered $nplain lines for the tag $TAG, wanted exactly one"
            [ "$npeeled" -le 1 ] || fail "GitHub answered $npeeled peeled lines for the tag $TAG"
            now=${peeled:-$plain}
            [[ "$now" =~ ^[0-9a-f]{40}$ ]] || fail "the commit of the tag $TAG is not 40 hex digits"
          }
          check_tag() {
            tag_commit
            for c in "$VERIFIED_COMMIT" "$BUILT_COMMIT"; do
              [[ "$c" =~ ^[0-9a-f]{40}$ ]] || fail "not a commit id: the verified commit or the built commit"
            done
            if [ "$now" != "$VERIFIED_COMMIT" ] || [ "$now" != "$BUILT_COMMIT" ]; then
              fail "the tag $TAG points at $now now; verify checked out $VERIFIED_COMMIT and build $BUILT_COMMIT; the tag was moved, refusing to publish"
            fi
          }
          check_tag
          # The files uploaded: the two archives and SHA256SUMS. NOTES.md is the text, not a file.
          files=("$a" "$b" SHA256SUMS)
          # A pre-release is a tag with a suffix (`v1.0.0-rc.1`) or a tag of major version 0 (`v0.x.y`):
          # GOVERNANCE.md says that until the first stable release the versions are pre-releases named
          # `v0.x.y`. Only a plain `vN.x.y` with N at least 1 is a full release. The tag form was checked
          # above (no leading zeros), so `v0.*` is exactly major version 0. This is the only place that
          # decides it.
          flags=()
          case "$TAG" in *-*|v0.*) flags+=(--prerelease) ;; esac
          # A draft first: nothing is public until the tag has been looked at once more. `--target` is
          # the built commit: if the tag were deleted after the second look, the release must not make
          # a tag at the head of the default branch. This job deletes nothing: when a check after the
          # draft fails, the draft stays and a person deletes it by hand.
          gh release create "$TAG" --draft --verify-tag --target "$BUILT_COMMIT" --title "$TAG" --notes-file NOTES.md "${flags[@]}" "${files[@]}" || fail "gh release create failed; a draft release for $TAG may have been left: look at the Releases page and delete it by hand"
          draft_note=". A DRAFT release for $TAG was left on the Releases page and must be deleted by hand; this job deletes nothing."
          # Find that draft by its id, so that the publication below cannot reach another release of the
          # same name (`gh release edit TAG` picks one itself). Every release with exactly this tag name
          # is collected: there must be exactly one, a draft, with exactly the files uploaded.
          matches=0; id=""; isdraft=""; assets=""
          list=$(gh api --paginate "repos/${GH_REPO}/releases" --jq '.[] | [.tag_name, .id, .draft, (.assets|length)] | @tsv') || fail "cannot list the releases of the repository"
          while IFS=$'\t' read -r t i d n; do
            if [ "$t" = "$TAG" ]; then matches=$((matches + 1)); id=$i; isdraft=$d; assets=$n; fi
          done <<<"$list"
          [ "$matches" -eq 1 ] || fail "found $matches releases named $TAG after the draft was created, wanted exactly one (so this token may not see drafts)"
          [ "$isdraft" = true ] || fail "the release named $TAG is not a draft"
          [[ "$id" =~ ^[0-9]+$ ]] || fail "the id of the draft is not a number"
          [[ "$assets" =~ ^[0-9]+$ ]] && [ "$assets" -eq "${#files[@]}" ] || fail "the draft holds $assets files, wanted ${#files[@]} (the two archives and SHA256SUMS)"
          check_tag
          # Publish that id. If this call fails, the release may in fact be published (the answer may have
          # been lost), so the note differs: look first.
          res=$(gh api -X PATCH "repos/${GH_REPO}/releases/${id}" -F draft=false --jq .draft) || fail "the draft could not be published"
          [ "$res" = false ] || fail "the release is still a draft after the publish call"
