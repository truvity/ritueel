# Judges pull requests: the site (description lint, a strict build that includes the demo of the local
# page, a link check, the Worker's tests and dry-run deploy, the status page in a browser), the local
# page and its API (the Protobuf lint and generated code, the page's lint and tests, both builds, the page
# in a browser under the site's policy), the workflows themselves (actionlint), the repository rules
# (`just check-rules`) and the Go code (formatting, vet, the linter, the module checks, the tests, the
# static build). It never publishes (site.yaml does), and it is not path-filtered, so
# it can be made a required check on `main`.
name: Checks

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: site (lint, strict build, links, dry-run deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: truvity/ci-actions/setup-devbox@2b62881ba13fa01ef0d22ef5b5657e4ba75ab0ce # v3.14.0
      # The build reads the issues for the status page (/status/) with the workflow's read-only
      # token; without one the page builds and says the issue figures are unavailable.
      - run: devbox run -- just site-check
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # What the deploy job of site.yaml builds, minus the deploy: `wrangler deploy --dry-run`
      # on the build. It uploads nothing and holds no Cloudflare credential.
      - run: devbox run -- just site-workers
      # The status page in headless Chrome (the runner's own): the live script against a stand-in
      # for the Worker, in light and dark, at 1440, 390 and 375 px.
      - run: devbox run -- just site-render

  # The local page (ui/) and its API (proto/): the generated code is what buf makes, the page's
  # TypeScript and its safety scan, its tests, both builds (the demo and the real one) and their
  # checks, and the page in headless Chrome (the runner's own) under the site's own
  # Content-Security-Policy. The demo as the site serves it is built by the `site` job.
  ui:
    name: ui (proto, lint, tests, builds, browser)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: truvity/ci-actions/setup-devbox@2b62881ba13fa01ef0d22ef5b5657e4ba75ab0ce # v3.14.0
      - run: devbox run -- just proto-check
      - run: devbox run -- just ui-lint
      - run: devbox run -- just ui-test
      - run: devbox run -- just ui-e2e

  workflows:
    name: workflows (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: truvity/ci-actions/setup-devbox@2b62881ba13fa01ef0d22ef5b5657e4ba75ab0ce # v3.14.0
      - run: devbox run -- actionlint

  # The Go code (cmd/, internal/, tools/): formatting, go vet, the linter, the module checks, the
  # tests and the static build (`just go-check`). The tools come from this repository's own
  # devbox.json and devbox.lock, installed by a public action (not the shared setup action of the
  # other jobs). A pull request only restores the Go caches; go-cache.yaml saves them from `main`.
  # refresh-cli keeps the install action from saving its own cache from a pull request.
  go:
    name: go (format, vet, lint, modules, tests, static build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jetify-com/devbox-install-action@05e954310554b6122a26b4880d69937f61b1eb2e # v0.16.0
        with:
          devbox-version: "0.19.0"
          # sha256 of the extracted devbox binary (linux-amd64), not of the release archive.
          sha256-checksum: "828fb26b9bc2ac63eb3fbc09aea365123db1d2810d0870895f67b5bbffd5ecdb"
          enable-cache: "false"
          refresh-cli: "true"
      - name: Restore the Go caches (this job never saves them)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum', 'devbox.lock') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('go.sum', 'devbox.lock') }}-
            go-${{ runner.os }}-
      - run: devbox run -- just go-check

  # The repository rules (tools/checks/, `just check-rules`), and the same public-content scan
  # over the commit messages and the pull request's title and body (`just check-messages`).
  # PUBLIC_CONTENT_DENYLIST is a repository secret: the private names that must never appear
  # here. A pull request from a fork gets no secrets, and the checks then skip that part and say
  # so. While the repository variable DENYLIST_REQUIRED is `true`, an empty list fails on this
  # repository's own branches and in the merge queue.
  rules:
    name: rules (decisions, public content, file names, agent links)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLIC_CONTENT_DENYLIST: ${{ secrets.PUBLIC_CONTENT_DENYLIST }}
      REQUIRE_DENYLIST: ${{ vars.DENYLIST_REQUIRED == 'true' && (github.event_name == 'merge_group' || github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit range origin/main..HEAD needs the history.
          fetch-depth: 0
          persist-credentials: false
      - uses: truvity/ci-actions/setup-devbox@2b62881ba13fa01ef0d22ef5b5657e4ba75ab0ce # v3.14.0
      - run: devbox run -- just check-rules
      - name: Commit messages and the pull request text
        env:
          BASE: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || format('origin/{0}', github.base_ref) }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: devbox run -- just check-messages

  # One name to require. A job that was skipped or cancelled is not a pass.
  checks:
    needs: [site, ui, workflows, rules, go]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every check succeeded
        env:
          RESULTS: ${{ needs.site.result }} ${{ needs.ui.result }} ${{ needs.workflows.result }} ${{ needs.rules.result }} ${{ needs.go.result }}
        run: |
          echo "site ui workflows rules go: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = "success" ] || { echo "::error::a check did not succeed"; exit 1; }
          done
