// Words and shapes shared by the two services of the local page.
//
// THE RULE OF THIS WHOLE PACKAGE: no call takes or returns a secret.
// There is no field for a PIN, a passphrase, a recovery key, a private
// key, a key file, a management key or a revocation signature, and none
// will be added. The page is a view. It never confirms a ceremony;
// confirmation, PINs, passphrases and touches happen in the terminal, on
// the offline system or the workstation. What the page may show about a key is public:
// fingerprints, algorithms, dates, the use of a slot.
//
// Everything the page shows is about one bundle: the directory of one trust
// domain (for example personal or acme), with its history, its roots, its
// cards and its trust files. The trust file keeps its full name, "CA
// bundle"; the bare word "bundle" means only the directory.
//
// The words are the glossary's: bundle, root, delegated key, holder,
// requester, store, ceremony, history, record, renew, replace, trust files.
// Replace means making a new key; a goal that only revokes subkeys that a
// newer one already replaced is called retire.

syntax = "proto3";

package ritueel.local.v1alpha1;

import "google/protobuf/timestamp.proto";

// How serious a finding or a due item is. The three upper levels are the
// ones of `ritueel status` (notice, alert, critical); `info` is for things
// that are true and worth knowing but need no action by a date.
enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  SEVERITY_INFO = 1;
  SEVERITY_NOTICE = 2;
  SEVERITY_ALERT = 3;
  SEVERITY_CRITICAL = 4;
}

// A store is where a key lives.
enum Store {
  STORE_UNSPECIFIED = 0;
  // A software key in an encrypted file, kept outside the bundle.
  STORE_SOFTWARE_FILE = 1;
  // A root card: the root's keys are born on one card; a bundle with two
  // roots uses a pair.
  STORE_ROOT_CARDS = 2;
  // A cloud KMS key, with a replica. It may be a key that ritueel adopted.
  STORE_CLOUD_KMS = 3;
}

// Where a ceremony runs, or ran (record 0005, rules 17 to 21). Every record
// says where its ceremony ran (rule 2), and a plan says where it will run.
enum RunPlace {
  // Not said; the page then writes "the terminal where you run it".
  RUN_PLACE_UNSPECIFIED = 0;
  // Vanilla AirgapOS, started from the ceremony USB stick, which has one
  // extra partition. Required for a key that can be copied (a key file); any
  // root may use it. The bundle goes there inside the stick's extra partition.
  RUN_PLACE_OFFLINE_SYSTEM = 1;
  // The holder's own computer. Allowed for a key that cannot be copied (a
  // root on cards, a cloud root) under four conditions: a touch for every
  // signature, the number of signatures stated in the plan, no retry of a
  // failed touch, and the result checked against the plan on a second device
  // before it is handed over or published. A test root may also run here.
  // A cloud key has no touch: for a cloud root the typed digest and the role
  // session stand, and its audit trail records every signature (record 0005,
  // rule 18). The count, no retry and the second-device check apply to both
  // kinds of key. No stick is needed.
  RUN_PLACE_WORKSTATION = 2;
}

// What a finding, a due item or a plan is about.
enum SubjectKind {
  SUBJECT_KIND_UNSPECIFIED = 0;
  SUBJECT_KIND_BUNDLE = 1;
  SUBJECT_KIND_ROOT = 2;
  SUBJECT_KIND_DELEGATED_KEY = 3;
  // A subkey of an OpenPGP certificate.
  SUBJECT_KIND_SUBKEY = 4;
  SUBJECT_KIND_USER_ID = 5;
  SUBJECT_KIND_CARD = 6;
  SUBJECT_KIND_CLOUD_KEY = 7;
  SUBJECT_KIND_TRUST_FILE = 8;
}

// The thing a line of text is about, so the page can link to it.
message Subject {
  SubjectKind kind = 1;
  // How to find it. For a key: its FULL fingerprint, never a short id (a
  // key is identified by its full fingerprint, not by its name). For a
  // card: its serial. For a root: its label (A, B ...), unique inside the
  // bundle; the page writes it bundle/label, for example acme/A. For a
  // trust file: its path.
  string identifier = 2;
  // A name for people. It is data, shown as text only, and never an
  // identity: two keys may carry the same label.
  string label = 3;
}

// What a holder wants to do. A plan is always built from one of these.
// Renewals are separate actions: there is no "yearly" intention.
enum Intention {
  INTENTION_UNSPECIFIED = 0;
  // Renew what `ritueel due` lists: a delegated key, a card check.
  INTENTION_RENEW_DUE = 1;
  // Adopt a key that already exists: an OpenPGP key, or a cloud KMS key.
  INTENTION_ADOPT_KEY = 2;
  // Retire subkeys that a newer one already replaced, by revoking them
  // with the reason "superseded".
  INTENTION_RETIRE_SUBKEYS = 3;
  // Register a new card in the bundle's inventory.
  INTENTION_ADD_CARD = 4;
  // Replace a lost or retired card.
  INTENTION_REPLACE_CARD = 5;
}

// Whether the hash chain of the history checks out.
enum ChainState {
  CHAIN_STATE_UNSPECIFIED = 0;
  // Not checked yet. What the page shows is then not authoritative.
  CHAIN_STATE_NOT_CHECKED = 1;
  // Every record names the one before and every hash matches.
  CHAIN_STATE_VERIFIED = 2;
  // A record is missing, changed or out of order.
  CHAIN_STATE_BROKEN = 3;
}

// The state of the history: the write-once part of the bundle, the folder
// history/, with one sub-folder and one record for each ceremony.
// record_count counts records, not saved plans.
message HistoryStatus {
  int32 record_count = 1;
  ChainState chain_state = 2;
  // The hash of the newest record, in hexadecimal.
  string head_record_sha256 = 3;
  // The id (the ceremony's name, for example 20260602T142000Z-card-check)
  // and title of the newest record, so a page can say "Last record".
  string last_record_id = 4;
  string last_record_title = 5;
  google.protobuf.Timestamp last_record_at = 6;
  // When the chain was last checked.
  google.protobuf.Timestamp checked_at = 7;
  // A sentence for people, for example "All 12 records check out."
  string message = 8;
}
