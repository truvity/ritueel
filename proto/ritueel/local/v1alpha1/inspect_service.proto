// The read service: everything the local page shows about the bundle.
//
// Every call here only reads. No call takes or returns a secret, a PIN or a
// passphrase (see common.proto). In the real program the answers come from
// the same functions as `ritueel status`, `ritueel records list` and the
// card check; in the demo they come from the fixture files.
//
// All text in an answer is data written by the bundle, not by the program:
// the page shows it as text only, caps its length, and shows any character
// that is not plain ASCII, any bidirectional, zero-width or control
// character as a visible U+XXXX escape.

syntax = "proto3";

package ritueel.local.v1alpha1;

import "google/protobuf/timestamp.proto";
import "ritueel/local/v1alpha1/common.proto";

service InspectService {
  // The start screen: the bundle, what is due, how many findings of each
  // severity, the state of the history, and what is left to set up.
  rpc GetSummary(GetSummaryRequest) returns (GetSummaryResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // What is wrong or weak, each with its reason, its severity and the
  // command that fixes it. Most of it can be told from a public key alone.
  rpc ListFindings(ListFindingsRequest) returns (ListFindingsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // The roots and their keys, their delegated keys, and for an OpenPGP
  // certificate its primary, user IDs and subkeys by year and by card.
  rpc ListRoots(ListRootsRequest) returns (ListRootsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // The history: one record for each ceremony, newest first, and whether
  // the chain of hashes checks out.
  rpc ListCeremonies(ListCeremoniesRequest) returns (ListCeremoniesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // The inventory of cards: every card, and for each card the use of every
  // slot of its three applications (PIV, OpenPGP and FIDO2).
  rpc ListCards(ListCardsRequest) returns (ListCardsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // The trust files the bundle can produce, with a check of each: the
  // newest numbered set, trust/<number>/. Publishing them is left to the
  // holder.
  rpc ListTrustFiles(ListTrustFilesRequest) returns (ListTrustFilesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// ---------------------------------------------------------------- summary

message GetSummaryRequest {}

message GetSummaryResponse {
  Bundle bundle = 1;
  // The moment the bundle was read. The page counts "days left" from this,
  // never from its own clock, so a fixture stays the same on any day.
  google.protobuf.Timestamp as_of = 2;
  // True when the answers come from a fixture and nothing can act.
  bool demo = 3;
  // The version of the program that answers, for example "0.0.0-demo".
  string program_version = 4;
  HistoryStatus history = 5;
  // What is due, soonest first.
  repeated DueItem due = 6;
  // How many findings there are of each severity.
  repeated FindingCount finding_counts = 7;
  Counts counts = 8;
  // Plans saved in the bundle that no ceremony has run yet.
  repeated PendingPlan pending_plans = 9;
  // The getting-started checklist, in order.
  repeated SetupStep setup_steps = 10;
}

// The directory with a fixed structure that holds everything ritueel knows
// about one trust domain: its history, roots, cards and trust files. No call
// names a bundle; which bundle the process serves is not decided by the records.
message Bundle {
  // Where the bundle is, as the holder knows it, for example
  // "~/ritueel/acme".
  string path = 1;
  // The bundle's name, which is the name of its directory: for example
  // "personal" or "acme". Also the first half of a root's written name across
  // bundles: acme/A. No file stores it.
  string name = 2;
  bool exists = 3;
  google.protobuf.Timestamp created_at = 4;
  // A role for the holder, never a real name: "the holder".
  string holder_label = 5;
}

// Something that has to be renewed or checked by a date.
message DueItem {
  string id = 1;
  DueKind kind = 2;
  string title = 3;
  // One or two plain sentences: what happens if it is left.
  string detail = 4;
  Subject subject = 5;
  google.protobuf.Timestamp due_at = 6;
  // From the number of days left: notice at 60, alert at 30, critical at 14.
  // Before the window opens it is info.
  Severity severity = 7;
  google.protobuf.Timestamp last_done_at = 8;
  // The wizard goal that plans it.
  Intention intention = 9;
}

enum DueKind {
  DUE_KIND_UNSPECIFIED = 0;
  // Renew a delegated key by certifying it again under its root.
  DUE_KIND_RENEW_DELEGATED_KEY = 1;
  // Renew a root's own certificate or primary.
  DUE_KIND_RENEW_ROOT = 2;
  // Renew the root list, a CRL or another trust file.
  DUE_KIND_RENEW_TRUST_FILE = 3;
  // The check of the root cards and the proof of life, every six months.
  DUE_KIND_CARD_CHECK = 4;
  // The restore check on a clean machine.
  DUE_KIND_RESTORE_DRILL = 5;
}

message FindingCount {
  Severity severity = 1;
  int32 count = 2;
}

message Counts {
  int32 roots = 1;
  int32 delegated_keys = 2;
  int32 cards = 3;
  int32 trust_files = 4;
}

// A plan that was saved and that no ceremony has attempted or recorded yet.
message PendingPlan {
  // The plan's name: the name of its ceremony.
  string plan_id = 1;
  // Path inside the bundle: history/<ceremony>/plan.json, for example
  // "history/20261111T090000Z-due/plan.json". Record 0006 (rule 7) decides
  // that the running process writes a saved plan there. The names of the
  // other members of the folder are proposed. record_count counts records
  // only.
  string path = 2;
  Intention intention = 3;
  string title = 4;
  // The plan's digest in full (64 hexadecimal characters).
  string digest = 5;
  google.protobuf.Timestamp saved_at = 6;
}

message SetupStep {
  string id = 1;
  string title = 2;
  string detail = 3;
  bool done = 4;
}

// --------------------------------------------------------------- findings

message ListFindingsRequest {
  // Leave unspecified for all findings.
  Severity min_severity = 1;
}

message ListFindingsResponse {
  // Most serious first.
  repeated Finding findings = 1;
}

message Finding {
  // Stable while the cause stays, so a link to it keeps working.
  string id = 1;
  // A short stable word for the kind of finding, for example "no-expiry".
  string code = 2;
  Severity severity = 3;
  // One line.
  string title = 4;
  // The reason, in plain words: why this matters to the holder.
  string reason = 5;
  Subject subject = 6;
  // The facts the finding rests on, one short line each.
  repeated string evidence = 7;
  // The exact command that fixes it (or builds the plan that fixes it).
  string fix_command = 8;
  // The wizard goal that plans the fix; unspecified if there is none.
  Intention fix_intention = 9;
  // A path on the ritueel site that teaches the point, for example
  // "/learn/revoke/". The page links to it.
  string learn_path = 10;
  // True when the page could tell this from a public key alone.
  bool visible_from_public_key = 11;
}

// ------------------------------------------------------------------ roots

message ListRootsRequest {}

message ListRootsResponse {
  repeated Root roots = 1;
}

enum RootKind {
  ROOT_KIND_UNSPECIFIED = 0;
  // A holder's own OpenPGP key.
  ROOT_KIND_PERSONAL = 1;
  // A small company's root: X.509, OpenPGP, break-glass SSH CA.
  ROOT_KIND_COMPANY = 2;
}

enum RootState {
  ROOT_STATE_UNSPECIFIED = 0;
  ROOT_STATE_ACTIVE = 1;
  // An old root and its replacement are both valid for a time.
  ROOT_STATE_OVERLAP = 2;
  ROOT_STATE_RETIRED = 3;
  ROOT_STATE_REVOKED = 4;
}

message Root {
  // The root's label in the bundle: A, B ... as in root.json, and the next
  // free letter for a later root. The page writes it bundle/label, for
  // example acme/A.
  string label = 1;
  // For example "Acme root A".
  string name = 2;
  RootKind kind = 3;
  Store store = 4;
  RootState state = 5;
  // True when the key existed before ritueel and was adopted as it is.
  bool adopted = 6;
  // A personal key has two stages. 1: an adopted software key, with its
  // history. 2: two more roots, card-born primaries (B and C), one on each
  // root card. 0 for other roots.
  int32 stage = 7;
  // The row of the root cards' layout that this root owns, 1 to 6 as drawn
  // (row 1 is the card's own jobs, so roots start at row 2). 0 when the
  // root is not on cards; a personal root at stage 1 names the row that is
  // kept for stage two. The map is built into the program and versioned.
  int32 card_row = 8;
  // The root card that holds it: one serial for a card-born root (empty
  // unless the store is root cards).
  repeated string card_serials = 9;
  // The OpenPGP creation time ritueel fixed and recorded.
  google.protobuf.Timestamp created_at = 10;
  // The keys of the root itself, one entry for each key.
  repeated RootKey keys = 11;
  // Set when the root has an OpenPGP primary.
  OpenPgpCertificate certificate = 12;
  // Set when the store is a cloud KMS.
  CloudKey cloud_key = 13;
  // What this root has certified for a requester.
  repeated DelegatedKey delegated_keys = 14;
  // One plain sentence about the root's situation.
  string note = 15;
}

enum RootKeyKind {
  ROOT_KEY_KIND_UNSPECIFIED = 0;
  ROOT_KEY_KIND_X509_ROOT = 1;
  ROOT_KEY_KIND_OPENPGP_PRIMARY = 2;
  // The break-glass SSH CA key.
  ROOT_KEY_KIND_SSH_CA = 3;
}

message RootKey {
  RootKeyKind kind = 1;
  // The two sides of a pair of root cards are two roots now (acme/A and
  // acme/B), each with its own keys, so a key has no side.
  reserved 2;
  reserved "side";
  // For example "rsa4096", "ecdsa-p384".
  string algorithm = 3;
  // The full fingerprint: 40 hexadecimal characters for OpenPGP, 64 for the
  // SHA-256 of an X.509 certificate or an SSH key.
  string fingerprint = 4;
  google.protobuf.Timestamp created_at = 5;
  // Unset means the key has no expiry.
  google.protobuf.Timestamp expires_at = 6;
  // The PIV slot on the card, for example "86". Empty if not on a card.
  string slot = 7;
  string card_serial = 8;
}

// A cloud KMS key. ritueel reads its public key and checks its policy; the
// operator's own code may own the key.
message CloudKey {
  // For example "aws-kms".
  string provider = 1;
  // The key as the provider names it (for AWS an ARN).
  string key_ref = 2;
  string alias = 3;
  string region = 4;
  string replica_region = 5;
  string replica_ref = 6;
  // True when the key policy passed ritueel's reference rules.
  bool policy_ok = 7;
  repeated string policy_notes = 8;
  google.protobuf.Timestamp adopted_at = 9;
}

enum DelegatedKeyKind {
  DELEGATED_KEY_KIND_UNSPECIFIED = 0;
  DELEGATED_KEY_KIND_X509_INTERMEDIATE = 1;
  DELEGATED_KEY_KIND_OPENPGP_SUBKEY = 2;
  DELEGATED_KEY_KIND_SSH_CA_KEY = 3;
}

enum DelegatedKeyState {
  DELEGATED_KEY_STATE_UNSPECIFIED = 0;
  DELEGATED_KEY_STATE_ACTIVE = 1;
  DELEGATED_KEY_STATE_EXPIRED = 2;
  DELEGATED_KEY_STATE_REVOKED = 3;
}

// A key that a root has certified or bound for a requester system. The
// private half stays where the requester made it.
message DelegatedKey {
  // The name in the bundle's configuration, for example "acme-ca".
  string name = 1;
  DelegatedKeyKind kind = 2;
  // The requester system that holds the key, as a name.
  string requester = 3;
  string fingerprint = 4;
  string algorithm = 5;
  // Where the requester keeps the private half.
  Store store = 6;
  DelegatedKeyState state = 7;
  google.protobuf.Timestamp certified_at = 8;
  google.protobuf.Timestamp expires_at = 9;
  // Fingerprint of the root key that certified it.
  string certified_by = 10;
  string detail = 11;
}

// An OpenPGP certificate: a primary, its user IDs and its subkeys.
message OpenPgpCertificate {
  RootKey primary = 1;
  repeated UserId user_ids = 2;
  // Oldest year first. One set is the subkeys made in one year on one card, or in one cloud key.
  repeated SubkeySet subkey_sets = 3;
}

message UserId {
  string text = 1;
  bool primary = 2;
  google.protobuf.Timestamp created_at = 3;
  bool revoked = 4;
}

// The subkeys made in one year on one card. A subkey that was made in
// software and loaded onto several cards is listed once, in the first set
// that holds it, with all its cards in Subkey.card_serials.
message SubkeySet {
  int32 year = 1;
  // The card the set was born on; empty for a set that lives in software
  // or in a cloud key.
  string card_serial = 2;
  // True when card_serial is set and that card is in the inventory of
  // ListCards. False when the set has no card, or when the card is not in
  // the inventory (the holder may no longer have it).
  bool card_in_inventory = 3;
  repeated Subkey subkeys = 4;
}

enum SubkeyUsage {
  SUBKEY_USAGE_UNSPECIFIED = 0;
  SUBKEY_USAGE_SIGN = 1;
  SUBKEY_USAGE_AUTHENTICATE = 2;
  SUBKEY_USAGE_ENCRYPT = 3;
}

enum SubkeyState {
  SUBKEY_STATE_UNSPECIFIED = 0;
  SUBKEY_STATE_VALID = 1;
  SUBKEY_STATE_EXPIRED = 2;
  SUBKEY_STATE_REVOKED = 3;
}

enum RevocationReason {
  REVOCATION_REASON_UNSPECIFIED = 0;
  // Replaced by a newer key. sqv and gpgv keep signatures made before the revocation; git verify-tag fails for any revoked key (measured 2026-11-10).
  REVOCATION_REASON_SUPERSEDED = 1;
  // The key may be in someone else's hands; signatures no longer stand.
  REVOCATION_REASON_COMPROMISED = 2;
  // No longer used.
  REVOCATION_REASON_RETIRED = 3;
}

enum SubkeyOrigin {
  SUBKEY_ORIGIN_UNSPECIFIED = 0;
  SUBKEY_ORIGIN_BORN_ON_CARD = 1;
  SUBKEY_ORIGIN_MADE_IN_SOFTWARE = 2;
  // Born in a cloud KMS key; the private half never left it.
  SUBKEY_ORIGIN_BORN_IN_KMS = 3;
}

message Subkey {
  string fingerprint = 1;
  SubkeyUsage usage = 2;
  string algorithm = 3;
  google.protobuf.Timestamp created_at = 4;
  // Unset means no expiry.
  google.protobuf.Timestamp expires_at = 5;
  SubkeyState state = 6;
  RevocationReason revocation_reason = 7;
  google.protobuf.Timestamp revoked_at = 8;
  SubkeyOrigin origin = 9;
  // The cards that hold the private half, as far as the bundle knows.
  repeated string card_serials = 10;
  // Fingerprint of the later subkey of the same use that replaces this
  // one; empty for the newest. A subkey that is valid and has this set is
  // "still valid though replaced".
  string replaced_by = 11;
}

// -------------------------------------------------------------- ceremonies

message ListCeremoniesRequest {}

message ListCeremoniesResponse {
  HistoryStatus history = 1;
  // Newest first. One record for each ceremony.
  repeated Ceremony ceremonies = 2;
}

enum CeremonyKind {
  CEREMONY_KIND_UNSPECIFIED = 0;
  // The first ceremony of a root: its keys are born.
  CEREMONY_KIND_INIT = 1;
  // An existing key is adopted as it is.
  CEREMONY_KIND_ADOPT_KEY = 2;
  // A first certificate or binding for a requester's key.
  CEREMONY_KIND_ADD_DELEGATED_KEY = 3;
  CEREMONY_KIND_RENEW = 4;
  CEREMONY_KIND_REPLACE = 5;
  CEREMONY_KIND_REVOKE = 6;
  // The check of the cards and the proof of life.
  CEREMONY_KIND_CARD_CHECK = 7;
  CEREMONY_KIND_RESTORE_DRILL = 8;
}

enum CeremonyOutcome {
  CEREMONY_OUTCOME_UNSPECIFIED = 0;
  CEREMONY_OUTCOME_DONE = 1;
  CEREMONY_OUTCOME_NOT_CONFIRMED = 2;
  CEREMONY_OUTCOME_REFUSED = 3;
  // An attempt that may have signed something and was never recorded.
  CEREMONY_OUTCOME_UNRESOLVED = 4;
}

// One record of the history.
message Ceremony {
  // The record's name, which is also the name of its sub-folder of the
  // history: the ceremony's time in UTC, a hyphen and the command with its
  // words joined by hyphens, for example "20260127T142000Z-due".
  string id = 1;
  CeremonyKind kind = 2;
  string title = 3;
  // What was done, in plain words, as the record tells it.
  string summary = 4;
  google.protobuf.Timestamp completed_at = 5;
  CeremonyOutcome outcome = 6;
  // The record this one names as the one before; empty for the first.
  string previous_id = 7;
  string record_sha256 = 8;
  string previous_record_sha256 = 9;
  // The digest of the plan that was confirmed (64 hexadecimal characters).
  string plan_digest = 10;
  // Labels of the roots (A) and names of the delegated keys it touched.
  repeated string subject_labels = 11;
  repeated string card_serials = 12;
  // The trust sequence this ceremony wrote; 0 if none.
  int32 trust_sequence = 13;
  // The guide on the site that the record names.
  string guide_path = 14;
  // Where the ceremony ran. Record 0005, rule 2: every record says where it
  // ran, on the workstation or in the offline system.
  RunPlace run_place = 15;
}

// ------------------------------------------------------------------ cards

message ListCardsRequest {}

message ListCardsResponse {
  repeated Card cards = 1;
  // When the inventory was last written from a read-only check.
  google.protobuf.Timestamp inventory_written_at = 2;
}

enum CardKind {
  CARD_KIND_UNSPECIFIED = 0;
  // A root card: it holds roots by row; used on the workstation or in the
  // offline system by the rules of the ceremony record (0005 rules 17 and 18).
  CARD_KIND_ROOT = 1;
  // A day-to-day card: signing and authentication subkeys, passkeys.
  CARD_KIND_DAY_TO_DAY = 2;
  // A rehearsal card: practice and tests. It never holds a real key, may be
  // reset, and serves only a test root. A card never changes its kind.
  CARD_KIND_REHEARSAL = 3;
  // A server card: a card that stays plugged into a server of a requester
  // system and signs for its services. An ordinary card, not a hardware
  // security module product. ritueel lists it in the inventory and only ever
  // reads it: it adopts nothing on it, changes no secret and checks no layout.
  CARD_KIND_SERVER = 4;
}

enum CardState {
  CARD_STATE_UNSPECIFIED = 0;
  CARD_STATE_ACTIVE = 1;
  CARD_STATE_RETIRED = 2;
  CARD_STATE_LOST = 3;
}

enum ApplicationUse {
  APPLICATION_USE_UNSPECIFIED = 0;
  APPLICATION_USE_IN_USE = 1;
  APPLICATION_USE_UNUSED = 2;
}

message Card {
  // The serial, as the holder's own data. The page shows it because the
  // page is private to the holder; the demo uses visibly made-up serials.
  string serial = 1;
  string name = 2;
  CardKind kind = 3;
  string model = 4;
  string firmware = 5;
  CardState state = 6;
  // Where the card is kept, for example "in the safe".
  string kept = 7;
  // The layout the card is checked against, and its version.
  int32 layout_version = 8;
  google.protobuf.Timestamp last_seen_at = 9;
  // The last check of the whole card against the layout.
  google.protobuf.Timestamp last_checked_at = 10;
  // One line: what the card is for and what it holds.
  string role_summary = 11;
  // Labels of the roots (A) that have a row on this card.
  repeated string root_labels = 12;
  // True when the one-time code application is switched off.
  bool one_time_codes_off = 13;
  // What changed since the previous reading; empty when nothing did.
  repeated string changes_since_last_reading = 14;
  PivApplication piv = 15;
  OpenPgpApplication openpgp = 16;
  Fido2Application fido2 = 17;
}

// PIV: 24 key slots, in six rows of four in the order 9a, 9c, 9d, 9e,
// then 82 to 95. Row 1 is the card's own jobs. Each row below is one root,
// with the same kind of key in the same column: X.509 root, OpenPGP
// primary, SSH CA, and one left empty.
message PivApplication {
  ApplicationUse use = 1;
  // Always six rows of four slots, so a page can draw them as given.
  repeated PivRow rows = 2;
}

message PivRow {
  // 1 to 6.
  int32 number = 1;
  // A word for the row: "card", or the label of the root that owns it (A),
  // or "free" for a row that no root owns yet.
  string label = 2;
  // The label of the root that owns the row; empty for row 1 and for free
  // rows.
  string root_label = 3;
  // Four slots.
  repeated Slot slots = 4;
}

// OpenPGP: three keys, sign, decrypt and authenticate.
message OpenPgpApplication {
  ApplicationUse use = 1;
  // Three slots with ids "sig", "dec" and "aut".
  repeated Slot slots = 2;
}

// FIDO2: passkeys. The cells shown are the ones the layout names.
message Fido2Application {
  ApplicationUse use = 1;
  repeated Slot passkeys = 2;
}

enum SlotState {
  SLOT_STATE_UNSPECIFIED = 0;
  SLOT_STATE_EMPTY = 1;
  SLOT_STATE_USED = 2;
  // Kept for a key that is planned but not yet born.
  SLOT_STATE_RESERVED = 3;
  // Not part of any root's row yet; free for a later root.
  SLOT_STATE_SPARE = 4;
}

enum SlotUse {
  SLOT_USE_UNSPECIFIED = 0;
  SLOT_USE_X509_ROOT = 1;
  SLOT_USE_OPENPGP_PRIMARY = 2;
  SLOT_USE_SSH_CA = 3;
  // A spare key-agreement key for unlocking a key file, made only if
  // passkey unlocking cannot be used.
  SLOT_USE_UNLOCK_KEY = 4;
  SLOT_USE_OPENPGP_SIGN = 5;
  SLOT_USE_OPENPGP_DECRYPT = 6;
  SLOT_USE_OPENPGP_AUTHENTICATE = 7;
  SLOT_USE_PASSKEY_SIGN_IN = 8;
  SLOT_USE_PASSKEY_SSH = 9;
  SLOT_USE_PASSKEY_UNLOCK = 10;
  // A key made on a rehearsal card to practise.
  SLOT_USE_REHEARSAL = 11;
  // A slot of a row that belongs to another bundle of the holder, declared in
  // this card's file; no key hash is shown. PROPOSED in record 0003 (Not yet
  // proven or only proposed, issue 11).
  SLOT_USE_OTHER_BUNDLE = 12;
}

enum PinRule {
  PIN_RULE_UNSPECIFIED = 0;
  PIN_RULE_NEVER = 1;
  PIN_RULE_ONCE = 2;
  PIN_RULE_ALWAYS = 3;
}

enum TouchRule {
  TOUCH_RULE_UNSPECIFIED = 0;
  TOUCH_RULE_NEVER = 1;
  TOUCH_RULE_CACHED = 2;
  TOUCH_RULE_ALWAYS = 3;
}

// One slot of one application. Only public facts: the use, the rules, the
// hash of the public key. Never a PIN, never a key.
message Slot {
  // PIV: "9a", "9c", "9d", "9e", "82" to "95". OpenPGP: "sig", "dec",
  // "aut". FIDO2: "1", "2", "3".
  string id = 1;
  SlotState state = 2;
  SlotUse use = 3;
  // The use in plain words, for example "X.509 root of acme/A".
  string purpose = 4;
  // The root the slot belongs to; empty if none.
  string root_label = 5;
  string algorithm = 6;
  PinRule pin_rule = 7;
  TouchRule touch_rule = 8;
  // SHA-256 of the public key, in hexadecimal; empty for an empty slot.
  string public_key_sha256 = 9;
  google.protobuf.Timestamp born_at = 10;
  // True when the bundle holds the maker's attestation for the key.
  bool attested = 11;
}

// ------------------------------------------------------------ trust files

message ListTrustFilesRequest {}

message ListTrustFilesResponse {
  // The newest trust sequence.
  int32 trust_sequence = 1;
  repeated TrustFile files = 2;
}

enum TrustFileKind {
  TRUST_FILE_KIND_UNSPECIFIED = 0;
  TRUST_FILE_KIND_ROOT_LIST = 1;
  TRUST_FILE_KIND_CA_BUNDLE = 2;
  TRUST_FILE_KIND_CRL = 3;
  TRUST_FILE_KIND_SSH_CA_KEYS = 4;
  TRUST_FILE_KIND_KEYRING = 5;
  // A person's public OpenPGP certificate, the one trust file of a personal
  // bundle: trust/<number>/<fingerprint>.pgp or .asc.
  TRUST_FILE_KIND_OPENPGP_CERTIFICATE = 6;
}

enum TrustCheckResult {
  TRUST_CHECK_RESULT_UNSPECIFIED = 0;
  TRUST_CHECK_RESULT_PASSED = 1;
  TRUST_CHECK_RESULT_PASSED_WITH_WARNING = 2;
  TRUST_CHECK_RESULT_FAILED = 3;
  TRUST_CHECK_RESULT_NOT_RUN = 4;
}

message TrustFile {
  // The file name, for example "root-list.json".
  string name = 1;
  TrustFileKind kind = 2;
  // Path inside the bundle.
  string path = 3;
  int32 trust_sequence = 4;
  google.protobuf.Timestamp built_at = 5;
  google.protobuf.Timestamp valid_until = 6;
  TrustCheckResult check_result = 7;
  // The check in plain words.
  string check_detail = 8;
  string sha256 = 9;
  int64 size_bytes = 10;
  // The command that checks the file (writes nothing).
  string verify_command = 11;
  // The command that plans a rebuild of it.
  string rebuild_command = 12;
}
