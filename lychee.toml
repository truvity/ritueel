# Link check for the built site (`just site-links`). In-site links and anchors are held by the
# build itself (starlight-links-validator); this is for every link, including the ones that
# leave the site.

cache = true
max_cache_age = "1d"
max_retries = 2
retry_wait_time = 2
timeout = 20
# A redirect loop must end in a few hops, not in ten hops of 20 s each.
max_redirects = 5
max_concurrency = 8
# 429 is a host asking for patience, not a dead link.
accept = ["200..=204", "429"]
user_agent = "Mozilla/5.0 (compatible; ritueel-docs-link-check)"

exclude = [
  # The site's own absolute URLs (canonical, sitemap, Open Graph) point at the deployed copy,
  # which does not have this build yet.
  '^https://ritueel\.id/',
  # Pages that exist only once a pull request is merged; the site links to them by their final path.
  '^https://github\.com/truvity/ritueel/(blob|tree|edit)/',
  # www.rfc-editor.org redirects /rfc/rfcNNNN to /info/rfcNNNN/ and that page to itself (301 in
  # a loop) or answers 502, as of 2026-11-01; it kept the link check busy for the whole job. The
  # RFC links are references, not something this site can fix; datatracker.ietf.org serves the
  # same documents.
  '^https://www\.rfc-editor\.org/',
  # Needs a token or a session.
  '^https://(www\.)?linkedin\.com',
]
